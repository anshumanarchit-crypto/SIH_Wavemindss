[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectralq"
version = "1.0.0"
description = "SpectralQ Evidence-First Decision and Integration Layer (SIH 2026, PS SIH26147 - NTRO)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.1",
    "scipy>=1.10.0",
    "scikit-learn==1.8.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "threadpoolctl>=3.2.0",
    "plotly>=5.15.0",
    "scikit-commpy>=0.8.0",
    "reedsolo>=1.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]
gui = [
    "streamlit>=1.28.0"
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["spectralq*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["python"]
